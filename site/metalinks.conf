# Which downloads on aspic get a Metalink (.meta4) beside them, and where else
# each one can be fetched. Read by site/metalinks.sh, which publish.sh runs on
# the tree before every --tree publish. One rule per line:
#
#   <path glob, from the site root>   <mirror URL template, or - for none>
#
# {name} is the file's own name and {ver} the first x.y.z version in it. A
# mirror is listed only when it serves the very same bytes -- checked against
# the SHA-256 GitHub records for a release asset, or by downloading anything
# else -- so a metalink never points aria2 at a copy that would fail its check.
#
# A rule that matches nothing is reported: a path that moved (a new OpenBSD
# release, say) should not quietly lose its metalink.
#
# Package-manager repositories are left out on purpose: apt, dnf and the rest
# fetch those themselves. These are the files people download by hand.

# --- Breeze, the Android app -------------------------------------------------
android/Breeze-*.apk                         https://github.com/monikapurpl3/breeze/releases/download/v{ver}/{name}

# --- Breeze Core --------------------------------------------------------------
windows/Breeze-Core-Setup-*.exe              https://github.com/monikapurpl3/breeze-core-native/releases/download/v{ver}/{name}
opnsense/os-breeze-core-*.pkg                https://github.com/monikapurpl3/breeze-core-native/releases/download/v{ver}/{name}
homebrew/dist/breeze-core-*.tar.zst          https://github.com/monikapurpl3/breeze-core-native/releases/download/v{ver}/{name}
freebsd/breeze-core-*.pkg                    https://github.com/monikapurpl3/breeze-core-native/releases/download/v{ver}/breeze-core-{ver}-freebsd-amd64.pkg
netbsd/All/breeze-core-*.tgz                 https://github.com/monikapurpl3/breeze-core-native/releases/download/v{ver}/breeze-core-{ver}-netbsd-amd64.tgz
openbsd/7.9/packages/amd64/breeze-core-*.tgz https://github.com/monikapurpl3/breeze-core-native/releases/download/v{ver}/breeze-core-{ver}-openbsd-7.9-amd64.tgz

# aspic.salataputarica.hr.eu.org — the project host.
#
# Deployed as /etc/nginx/conf.d/aspic.conf. This copy is the source of truth:
# edit here, push, reload. The live file is a copy, not the original.
#
# STATIC FILES ONLY. There is no server-side component, no database, no upload
# path, nothing executable, and no key material — the package repositories this
# will serve are built and signed elsewhere, and clients verify the signatures
# themselves. A compromise of this host can serve stale or missing files; it
# cannot forge a package that apt, dnf, pacman or apk will accept.
#
# Releases are unpacked into releases/<utc-timestamp>/ and "current" is an
# atomically swapped symlink, so a deploy is never half-visible and a rollback
# is one symlink. See site/publish.sh.

limit_req_zone  $binary_remote_addr zone=aspic_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=aspic_conn:10m;

# Content-Security-Policy, resolved per request into a single header.
#
# The site itself needs no inline anything: its CSS is an external file for
# exactly this reason, and there is no JavaScript at all, so default-src 'none'
# with style-src 'self' covers every resource the page loads.
#
# The exception is the shared error pages under /var/www/nginx-error-pages: each
# one carries an inline <style> block holding its own status colour. Hashing
# forty of those would put a policy in this file that breaks the next time
# somebody edits an error page, so those two paths — and only those — allow
# inline style. Everything else, script included, stays denied.
#
# A map rather than per-location add_header: in nginx an add_header inside a
# location discards *every* header inherited from the server block, so relaxing
# one directive in one place would silently drop HSTS and the rest with it.
#
# One visible consequence, left as it is on purpose: those shared error pages
# also @import a webfont from fonts.googleapis.com, and `default-src 'none'`
# blocks it, so an error page here renders in the fallback font. Allowing that
# host would mean every 404 on this site told Google about itself, which is a
# poor trade for Open Sans on a page nobody wants to be reading.
map $uri $aspic_csp {
    ~^/_errors/            "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    # The key is quoted because it contains {3}: braces are how nginx delimits a
    # block, so an unquoted regex carrying them fails to parse with a bare
    # `unexpected "{"` that says nothing about which brace it means.
    "~^/[0-9]{3}\.html$"   "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    default                "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
}

# Cache-Control, same one-header-many-rules reasoning.
#
# Regex entries are tried in the order written, so the repository rules come
# first. They match nothing until the first package repository lands here, and
# they are written now on purpose: a cached index is how a published release
# becomes invisible to "apt update", and that failure reads as a broken publish
# rather than as a caching bug.
map $uri $aspic_cache_control {
    # repository indexes: revalidate every time, they are how a client learns
    # that a new version exists
    ~*/(InRelease|Release(\.gpg)?|Packages(\.gz|\.xz|\.bz2)?|Sources(\.gz|\.xz)?|repomd\.xml(\.asc|\.key)?|APKINDEX\.tar\.gz|packagesite\.pkg|meta\.conf|pkg_summary\.gz)$  "no-cache";
    ~*\.db(\.sig|\.tar\.gz)?$                       "no-cache";
    # published packages never change under a given filename
    ~*\.(deb|rpm|apk|ipk|txz|tgz|zst|exe|msi|whl)$  "public, max-age=31536000, immutable";
    # the entry documents must be revalidated or visitors pin an old page
    ~*\.html$                                       "no-cache, must-revalidate";
    /                                               "no-cache, must-revalidate";
    ~*\.(css|svg|png|ico)$                          "public, max-age=3600";
    default                                         "public, max-age=300";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aspic.salataputarica.hr.eu.org;

    ssl_certificate     /etc/letsencrypt/live/aspic.salataputarica.hr.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aspic.salataputarica.hr.eu.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    # The certificate is ECDSA, so the DHE-RSA suites at the end of that list
    # are only reachable by a client that gets an RSA certificate — none here.
    # The dhparam is loaded anyway: it costs nothing, and it is what stops those
    # suites being silently unusable if an RSA cert is ever added alongside.
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_session_cache shared:aspic_ssl:2m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    # OCSP stapling is deliberately omitted: Let's Encrypt retired its OCSP
    # responders, so ssl_stapling now only produces error-log noise.

    server_tokens off;
    root /var/www/aspic/current;
    index index.html;

    include snippets/error_pages.conf;

    access_log /var/log/nginx/aspic.access.log;
    error_log  /var/log/nginx/aspic.error.log;

    # --- security headers ---------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $aspic_csp always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Package managers are not browsers and ignore this; it costs a repository
    # user nothing and stops a page on another origin embedding anything here.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    # Matches this host's site-wide policy (conf.d/global-headers.conf). Delete
    # this line to let the project index appear in search results.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $aspic_cache_control always;

    # --- rate limiting ------------------------------------------------------
    # Deliberately generous. Every visitor arriving through the router's NAT
    # hairpin shares one source address, and a package manager fetches an index
    # plus every package it resolves in one burst, so a tight per-IP limit would
    # throttle a legitimate upgrade and the whole household with it.
    limit_req  zone=aspic_req burst=60 nodelay;
    limit_conn aspic_conn 24;
    limit_req_status 429;
    limit_conn_status 429;

    # a download host answers reads and nothing else
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        # autoindex is what makes a repository tree browsable by a human trying
        # to work out what is actually published. index.html still wins wherever
        # one exists, so it never shadows a landing page.
        autoindex on;
        autoindex_exact_size off;
        try_files $uri $uri/ =404;
    }

    # nothing here is a dotfile, so anything asking for one is probing
    location ~ /\. {
        deny all;
    }

    # release internals are reachable only through the "current" symlink
    location ^~ /releases/ {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name aspic.salataputarica.hr.eu.org;

    server_tokens off;

    # kept available so a renewal can fall back to --webroot without editing
    # this file, as the other vhosts on this box allow
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

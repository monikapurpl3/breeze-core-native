# Breeze Core — supervisord program (any OS, and the usual choice inside a
# container that has to run more than one thing).
#
#   cp deploy/init/supervisor-breeze-core.conf /etc/supervisor/conf.d/breeze-core.conf
#   supervisorctl reread && supervisorctl update
#
# Set the bind address here rather than in breeze-core.env: supervisord does
# not source shell files, so `environment=` below is the whole configuration.

[program:breeze-core]
# 127.0.0.1 assumes a reverse proxy in front. For direct LAN use put this
# machine's own LAN address here — never 0.0.0.0.
command=/usr/bin/breeze-core serve --host 127.0.0.1 --port 8420
user=breeze
environment=AC_CONFIG_DIR="/etc/breeze-core"
autostart=true
autorestart=true
startsecs=5
; The default TERM is right here. Stores are written to a temporary file and
; renamed into place, so no signal can catch one half-written, and nothing in
; the binary treats INT specially the way uvicorn did.
stopsignal=TERM
stdout_logfile=/var/log/breeze-core.log
redirect_stderr=true

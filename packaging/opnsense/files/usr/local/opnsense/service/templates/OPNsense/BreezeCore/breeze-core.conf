{# Rendered by configd into /usr/local/etc/rc.conf.d/breeze_core -- see +TARGETS.
   That exact path matters: load_rc_config() sources ${_d}/rc.conf.d/$name for
   _d in "/etc ${local_startup%/rc.d}", i.e. /etc and /usr/local/etc, and nowhere
   else. Rendering somewhere tidier (breeze-core/breeze_core.conf, say) leaves the
   rc script on its built-in defaults, so the GUI's address and port never reach
   the server at all -- with no error anywhere, because every value is still valid.

   Only the knobs that belong to the firewall live here. The API key and the
   paired-unit list stay in Breeze Core's own config.json, written by its panel
   and its pairing flow -- templating over that would clobber credentials on
   every save. #}
breeze_core_enable="{% if helpers.exists('OPNsense.BreezeCore.general.enabled') and OPNsense.BreezeCore.general.enabled == '1' %}YES{% else %}NO{% endif %}"
breeze_core_host="{{ OPNsense.BreezeCore.general.listen|default('127.0.0.1') }}"
breeze_core_port="{{ OPNsense.BreezeCore.general.port|default('8420') }}"
breeze_core_config="/usr/local/etc/breeze-core/config.json"

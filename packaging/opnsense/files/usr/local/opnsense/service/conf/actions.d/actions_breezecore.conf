[start]
command:/usr/local/etc/rc.d/breeze_core onestart
parameters:
type:script
message:starting Breeze Core

[stop]
command:/usr/local/etc/rc.d/breeze_core onestop
parameters:
type:script
message:stopping Breeze Core

[restart]
command:/usr/local/etc/rc.d/breeze_core onerestart
parameters:
type:script
message:restarting Breeze Core

; reconfigureAction() calls stop, `template reload`, then start OR reload
; depending on the service state, so reload has to exist. The server has no
; config reload signal, so it is honestly a restart.
[reload]
command:/usr/local/etc/rc.d/breeze_core onerestart
parameters:
type:script
message:reloading Breeze Core

[status]
command:/usr/local/etc/rc.d/breeze_core onestatus
parameters:
type:script
message:requesting Breeze Core status

; Separate from restart so saving settings need not bounce the service.
[configure]
command:/usr/local/opnsense/scripts/OPNsense/BreezeCore/setup.sh
parameters:
type:script
message:configuring Breeze Core

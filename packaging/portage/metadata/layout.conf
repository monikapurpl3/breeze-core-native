# Gentoo overlay metadata for the aspic repository.
#
# masters = gentoo, because the ebuilds inherit eclasses (systemd, acct-user,
# acct-group) that live in the Gentoo tree. An overlay without this line fails
# at `inherit` with a message that names the eclass rather than the cause.
masters = gentoo

# Thin manifests: the only Manifest entries are DIST lines for the release
# tarballs. A non-thin overlay would additionally hash every ebuild and every
# file in files/, which is signing infrastructure this repository does not have
# and would only be able to fake.
thin-manifests = true
sign-manifests = false

manifest-hashes = BLAKE2B SHA512
manifest-required-hashes = BLAKE2B

profile-formats = portage-2
cache-formats = md5-dict
repo-name = aspic

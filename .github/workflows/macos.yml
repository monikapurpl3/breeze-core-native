name: macOS and Homebrew

# The Mac binaries are cross-built on Linux, the way the workstation builds the
# release (packaging/build-binaries.sh: cargo zigbuild, plus the CoreFoundation
# stub in packaging/macos/). This builds them that way, then RUNS them on real
# Macs, Apple silicon and Intel. Nothing is compiled on the Macs: they only show
# whether what the release ships runs. It then installs the Homebrew formula
# build-repo.sh publishes, on those Macs and under Homebrew on Linux (amd64 and
# arm64). The repository is public, so none of these runners cost anything.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Also install from the published tap on aspic"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/macos.yml
      - packaging/build-binaries.sh
      - packaging/dist-archive.sh
      - packaging/macos/**
      - packaging/homebrew/**
      - packaging/nfpm/breeze-core.env
      - crates/**
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-zigbuild --locked
      # The four the Homebrew formula installs.
      - run: bash packaging/build-binaries.sh macos-arm64 macos-x86_64 amd64 arm64
      - uses: actions/upload-artifact@v7
        with:
          name: macos-binaries
          path: |
            packaging/out/dist/*-macos-*.tar.zst
            packaging/out/dist/*-linux-amd64.tar.zst
            packaging/out/dist/*-linux-arm64.tar.zst
          if-no-files-found: error
          retention-days: 7

  run:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, label: macos-arm64 }
          - { runner: macos-15-intel, label: macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: macos-binaries
      - name: Unpack, as a user would
        # macOS's own tar, not GNU tar: whether it reads .tar.zst is part of
        # what is being checked.
        run: |
          set -eux
          uname -a; sw_vers
          mkdir bc && tar -xf breeze-core-*-${{ matrix.label }}.tar.zst -C bc
          ls -l bc
          test -x bc/breeze-core
      - name: What it is
        run: |
          set -eux
          file bc/breeze-core
          otool -L bc/breeze-core
          codesign -dv bc/breeze-core 2>&1 || true
          spctl --assess --type execute -vv bc/breeze-core 2>&1 || true
      - name: It runs
        run: |
          set -eux
          bc/breeze-core --version
          bc/breeze-core --help | head -5
          # Linux only: on a Mac it must say so, not fail obscurely.
          bc/breeze-core proxy --dry-run 2>&1 | tee proxy.txt || true
          grep -q "wiki" proxy.txt
      - name: It serves, pairs a client, and knows the time zone
        # The local time zone is the one thing that needed CoreFoundation, so it
        # is checked against the Mac's own clock -- in a zone that is not UTC,
        # where falling back to UTC by mistake would show. TZ stays unset: with
        # it set, the time zone would never be asked of CoreFoundation at all.
        run: |
          set -eux
          unset TZ
          # systemsetup can fail without saying so (it did on macOS 26), so the
          # link it would have made is made as well, from wherever this macOS
          # keeps its zone files.
          sudo systemsetup -settimezone Pacific/Auckland || true
          zi=/var/db/timezone/zoneinfo; [ -e "$zi/Pacific/Auckland" ] || zi=/usr/share/zoneinfo
          sudo ln -sf "$zi/Pacific/Auckland" /etc/localtime
          ls -l /etc/localtime; date
          d=$(mktemp -d)
          printf '{"api_key": "%s", "units": []}\n' "$(openssl rand -hex 16)" > "$d/config.json"
          for f in programs devices timers; do printf '{"%s": []}' "$f" > "$d/$f.json"; done
          export AC_CONFIG="$d/config.json" AC_DEVICES="$d/devices.json" AC_PROGRAMS="$d/programs.json" \
            AC_TIMERS="$d/timers.json" BREEZE_CLI_PROFILE="$d/cli.json"
          bc/breeze-core serve --host 127.0.0.1 --port 8420 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8420/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8420/api/health | grep -q '"ok"'
          # login reads the key from AC_CONFIG and approves itself from 127.0.0.1.
          bc/breeze-core login --base-url http://127.0.0.1:8420 < /dev/null
          bc/breeze-core diag --nerd nerd.json || true
          bc/breeze-core units --config "$d/config.json"
          test -s nerd.json
          theirs=$(sed -n 's/.*"utc_offset_seconds": *\(-\{0,1\}[0-9]*\).*/\1/p' nerd.json | head -1)
          z=$(date +%z); sign=${z:0:1}; hh=$((10#${z:1:2})); mm=$((10#${z:3:2}))
          ours=$(( hh * 3600 + mm * 60 )); [ "$sign" = "-" ] && ours=$(( -ours ))
          echo "server says $theirs s, macOS says $ours s ($z)"
          # An if, not `a && b`: set -e ignores a failure on the left of &&,
          # which is how a UTC-only run once passed this.
          if [ "$ours" = 0 ]; then echo "the zone never changed, so this proves nothing"; exit 1; fi
          if [ "$theirs" != "$ours" ]; then echo "the server's local time zone is wrong"; exit 1; fi
          cat serve.log
          kill %1

  # The formula as build-repo.sh writes it, pointed at these tarballs instead of
  # aspic, installed and run with Homebrew the way the wiki says to.
  homebrew:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: macos-binaries
          path: dist
      - name: Homebrew on Linux, and a user session for brew services
        if: runner.os == 'Linux'
        # brew services on Linux is a systemd *user* unit, which needs the
        # runner's user manager running: lingering starts it without a login.
        run: |
          set -eux
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          echo /home/linuxbrew/.linuxbrew/sbin >> "$GITHUB_PATH"
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          ls -l "/run/user/$(id -u)/"
      - name: A tap holding the generated formula
        # brew update first: users' Homebrew updates itself, and the formula
        # uses post_install_steps, which an image's older brew may not know.
        run: |
          set -eux
          brew update --quiet
          brew --version
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/breeze-core/Cargo.toml | head -1)
          bash packaging/homebrew/make-formula.sh "$ver" "file://$PWD/dist" dist > breeze-core.rb
          brew tap-new --no-git local/breeze
          cp breeze-core.rb "$(brew --repository local/breeze)/Formula/"
          # Enforced: brew's own lint is what keeps the formula loadable as
          # Homebrew changes (post_install is already rejected by it).
          brew style "$(brew --repository local/breeze)/Formula/breeze-core.rb"
          brew audit --formula local/breeze/breeze-core
      - name: brew install
        run: |
          set -eux
          brew install local/breeze/breeze-core
          brew test local/breeze/breeze-core
          command -v breeze-core
          breeze-core --version
          grep -q '^BREEZE_HOST=127.0.0.1$' "$(brew --prefix)/etc/breeze-core/breeze-core.env"
      - name: brew services start, reading breeze-core.env
        # The port is moved off the default, so an answer on 8431 shows the
        # wrapper read the env file rather than the binary's own default.
        run: |
          set -eux
          etc="$(brew --prefix)/etc/breeze-core"
          # What `breeze-core pair` writes, without the units it needs to find.
          printf '{"api_key": "%s", "units": []}\n' "$(openssl rand -hex 16)" > "$etc/config.json"
          # Not sed -i: BSD and GNU sed disagree on its argument.
          sed 's/^BREEZE_PORT=.*/BREEZE_PORT=8431/' "$etc/breeze-core.env" > env.new
          cat env.new > "$etc/breeze-core.env"
          brew services start breeze-core
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8431/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8431/api/health | grep -q '"ok"'
          brew services list | grep breeze-core
          # The CLI finds the same config.json through the wrapper.
          breeze-core login --base-url http://127.0.0.1:8431 < /dev/null
          breeze-core diag || true
          cat "$(brew --prefix)/var/log/breeze-core.log"
      - name: Reinstall keeps the settings, uninstall keeps the store
        run: |
          set -eux
          etc="$(brew --prefix)/etc/breeze-core"
          brew reinstall local/breeze/breeze-core
          grep -q '^BREEZE_PORT=8431$' "$etc/breeze-core.env"
          brew services stop breeze-core
          brew uninstall breeze-core
          test -s "$etc/config.json"
          if command -v breeze-core; then exit 1; fi

  # After a release: the tap exactly as published, from aspic.
  homebrew-live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Auto-update left on, as it is for a user.
    env:
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - if: runner.os == 'Linux'
        run: |
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - run: |
          set -eux
          brew tap aspic/breeze https://aspic.salataputarica.hr.eu.org/homebrew/breeze.git
          # Homebrew loads nothing from a third-party tap until it is trusted,
          # once. A `brew tap-new` tap, as in the job above, is trusted from
          # the start, which is why only this job meets it -- as users do.
          brew trust aspic/breeze
          brew install breeze-core
          breeze-core --version
          brew test breeze-core

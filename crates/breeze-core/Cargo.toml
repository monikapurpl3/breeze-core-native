[package]
name = "breeze-core"
version = "4.3.2"
description = "LAN-first REST API and control panel for Midea air conditioners"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
breeze-http = { path = "../breeze-http", default-features = false }
# `pair` writes config.json before any server exists, so the binary needs the
# store and the discovery it would otherwise reach through the API. No size
# cost: breeze-http already links both.
breeze-auth = { path = "../breeze-auth" }
breeze-device = { path = "../breeze-device" }
breeze-proto = { path = "../breeze-proto" }
breeze-store = { path = "../breeze-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The CLI subcommands are API clients. No TLS of its own: when the `cloud`
# feature is on, the shared ureq has it and an https base URL works; without it
# the CLI is http-only, which is what a LAN deployment is anyway.
ureq = { version = "2", default-features = false, features = ["json"] }
# `breeze-core fetch`: the clouds themselves. Only in a build that has TLS to
# reach Midea with.
breeze-cloud = { path = "../breeze-cloud", optional = true }
# A prompt that does not echo: fetch's Midea password, and since 4.4.0 the
# backup passphrase, which every build needs.
rpassword = "7"
# `breeze-core backup` and `restore`: the passphrase through Argon2id, the store
# files through AES-256-GCM. Pure Rust, and `aes` is already linked for the
# protocol; what this adds is GHASH and Argon2's BLAKE2b.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.2"
zeroize = "1"

[features]
default = ["cloud"]
# Passed through to breeze-http. `--no-default-features` drops the TLS stack,
# which is 1.2 MB -- the difference between fitting on a router and not.
cloud = ["breeze-http/cloud", "dep:breeze-cloud"]

[package]
name = "breeze-core"
version = "4.0.0-dev"
description = "LAN-first REST API and control panel for Midea air conditioners"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
breeze-http = { path = "../breeze-http", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The CLI subcommands are API clients. No TLS of its own: when the `cloud`
# feature is on, the shared ureq has it and an https base URL works; without it
# the CLI is http-only, which is what a LAN deployment is anyway.
ureq = { version = "2", default-features = false, features = ["json"] }

[features]
default = ["cloud"]
# Passed through to breeze-http. `--no-default-features` drops the TLS stack,
# which is 1.2 MB -- the difference between fitting on a router and not.
cloud = ["breeze-http/cloud"]
